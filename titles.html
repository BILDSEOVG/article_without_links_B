<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titel Ausfüllrate | Link Monitoring Dashboard</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body.titles-page {
            background: linear-gradient(135deg, #ff8c42 0%, #ff7a1f 100%);
        }
        .titles-header {
            background: linear-gradient(135deg, #ff8c42 0%, #ff7a1f 100%);
        }
        .titles-tabs {
            display: flex;
            gap: 10px;
            padding: 15px 40px 0;
            border-bottom: 3px solid #e0e0e0;
            background: white;
        }
        .titles-tab-btn {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 4px solid transparent;
            font-size: 15px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .titles-tab-btn.active {
            color: #ff8c42;
            border-bottom-color: #ff8c42;
        }
        .titles-tab-btn:hover {
            color: #ff8c42;
        }
        .titles-tab-content {
            display: none;
        }
        .titles-tab-content.active {
            display: block;
        }
        .placeholder-section {
            padding: 60px 40px;
            text-align: center;
            background: #f8f9fa;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .placeholder-section h2 {
            font-size: 32px;
            color: #333;
            margin: 0 0 20px 0;
        }
        .placeholder-section p {
            font-size: 18px;
            color: #999;
            margin: 0;
        }
    </style>
</head>
<body class="titles-page">
    <div class="container">
        <header class="titles-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Titel Ausfüllrate</h1>
                    <p>H1 vs. H2 Ähnlichkeitsanalyse</p>
                </div>
                <a href="./" style="color: white; font-size: 14px; text-decoration: none; margin-right: 20px;">← Zurück zum Dashboard</a>
            </div>
        </header>

        <div class="titles-tabs">
            <button class="titles-tab-btn active" data-tab="tab-h1-h2">Titel Ausfüllrate</button>
            <button class="titles-tab-btn" data-tab="tab-optimierung">Optimierungsrate</button>
        </div>

        <div id="tab-h1-h2" class="titles-tab-content active">
            <div class="controls">
                <div id="lastUpdated" class="last-updated"></div>
                <div class="date-controls">
                    <button class="date-filter-btn" id="yesterdayBtn">Gestern</button>
                    <button class="date-filter-btn" id="weekBtn">Letzte Woche</button>
                    <button class="date-filter-btn" id="monthBtn">Letzter Monat</button>
                    <button class="date-filter-btn" id="allBtn">Seit Beginn</button>
                    <input type="date" id="dateInput" class="date-input" placeholder="Oder wählen Sie ein Datum">
                </div>
            </div>

            <div class="chart-container">
                <canvas id="h1h2TrendChart"></canvas>
            </div>

            <div class="category-controls">
                <label for="h1h2FilterSelect">Filter:</label>
                <select id="h1h2FilterSelect">
                    <option value="">Alle</option>
                    <option value="90">≥ 90% ähnlich (kritisch)</option>
                    <option value="80">≥ 80% ähnlich (auffällig)</option>
                </select>
            </div>

            <div id="h1h2Stats" class="stats-cards">
                <div class="card">
                    <div class="label">Gesamt</div>
                    <div class="value" id="h1h2StatTotal">—</div>
                </div>
                <div class="card">
                    <div class="label">≥ 90% ähnlich</div>
                    <div class="value" id="h1h2StatAbove90">—</div>
                </div>
                <div class="card">
                    <div class="label">≥ 80% ähnlich</div>
                    <div class="value" id="h1h2StatAbove80">—</div>
                </div>
                <div class="card">
                    <div class="label">Ø Ähnlichkeit</div>
                    <div class="value" id="h1h2StatAverage">—</div>
                </div>
            </div>

            <section class="articles-section">
                <h2>H1 vs. H2 Vergleich</h2>
                <table id="h1h2Table" class="articles-table">
                    <thead>
                        <tr>
                            <th>Titel</th>
                            <th>H1</th>
                            <th>H2</th>
                            <th>Ähnlichkeit</th>
                            <th>Link</th>
                        </tr>
                    </thead>
                    <tbody id="h1h2Body">
                    </tbody>
                </table>
                <div id="h1h2NoDataMsg" class="no-data">Keine Daten verfügbar</div>
            </section>
        </div>

        <div id="tab-optimierung" class="titles-tab-content">
            <div class="placeholder-section">
                <h2>Optimierungsrate</h2>
                <p>🔄 Kommt demnächst</p>
            </div>
        </div>
    </div>

    <script src="./titles.js"></script>
</body>
</html>
